<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.layout == 'business' and page.name %}{{ page.name }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <p class="tagline">{{ site.description }}</p>
    </div>
  </header>
  <main class="container">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>{{ site.title }} — מדריך עסקים ובעלי מקצוע בקהילה.</p>
      <p><a href="https://github.com/mmaxiw/community-plus">צפו ב-GitHub</a> · <a href="https://github.com/mmaxiw/community-plus#איך-מוסיפים-עסק-או-בעל-מקצוע">הוסיפו את העסק שלכם</a></p>
    </div>
  </footer>
</body>
</html>
