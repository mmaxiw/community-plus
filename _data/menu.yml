# תפריט קיצורי דרך — מופיע בסרגל הצד.
#
# כל קבוצה (group) מקבלת כותרת ורשימת פריטים (items).
# כל פריט יכול להיות מסוג:
#   - tag: <שם תגית>   — סינון לפי תגית מדויקת
#   - q:   <מילת חיפוש> — חיפוש חופשי (מתאים לקטגוריות או למילות מפתח)
#
# label הוא הטקסט שמופיע על הכפתור.

groups:
  - title: קטגוריות
    items:
      - label: אוכל ומשקאות
        q: אוכל
      - label: שירותי בית
        q: שירותי בית
      - label: יצירתי ומקצועי
        q: יצירתי

  - title: מקצועות
    items:
      - label: מאפייה
        tag: מאפייה
      - label: אינסטלציה
        tag: אינסטלציה
      - label: ניקיון
        tag: ניקיון
      - label: עיצוב
        tag: עיצוב

  - title: סוגים
    items:
      - label: עסק משפחתי
        tag: משפחתי
      - label: שירות חירום
        tag: חירום
      - label: ידידותי לסביבה
        tag: אקולוגי
